http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443

# Open web: the agent may reach any HTTPS site by name. The allowlist model is
# replaced by a denylist: the agent needs to browse arbitrary sites the way a
# person does. What stays closed below is what an allowlist used to buy us.

# 1. Private space and cloud metadata - unchanged from the allowlist era.
#    169.254.0.0/16 covers the cloud metadata endpoint; RFC1918 covers the host
#    network, other containers and anything on the provider's LAN.
acl denied_ipv4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl denied_ipv6 dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32

# 2. Cloud metadata by name, in case DNS points at a routable address.
acl denied_metadata dstdomain metadata.google.internal metadata.goog

# 3. Bare IP literals. With an open web a public IP is reachable by default,
#    and dialling one directly is how a request dodges every name-based rule
#    here. The agent has no legitimate reason to skip DNS, so require names.
acl denied_numeric dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
acl denied_numeric6 dstdom_regex ^\[?[0-9a-fA-F:]+\]?$

# 4. Typical exfiltration channels. This does not make leaking impossible -
#    any site can carry data in a URL - but it closes the paste bins, anonymous
#    file drops, request catchers and tunnels that an injected instruction
#    reaches for first, and that have no legitimate use for this agent.
acl denied_exfil dstdomain .pastebin.com .paste.ee .hastebin.com .ghostbin.co .dpaste.org .rentry.co .privatebin.net .termbin.com .0x0.st .transfer.sh .file.io .oshi.at .temp.sh .anonfiles.com .gofile.io .catbox.moe .bashupload.com .wetransfer.com .send.vis.ee .webhook.site .requestbin.com .requestbin.net .pipedream.net .beeceptor.com .ngrok.io .ngrok-free.app .ngrok.app .serveo.net .localtunnel.me .loca.lt .trycloudflare.com

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access deny denied_ipv4
http_access deny denied_ipv6
http_access deny denied_metadata
http_access deny denied_numeric
http_access deny denied_numeric6
http_access deny denied_exfil
http_access allow CONNECT SSL_ports
http_access deny all

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB

via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

# Journal of where the agent actually went. The allowlist used to answer that
# question by itself; with an open web it has to be written down. Compact
# format, tmpfs-backed (16 MB in compose), rotated by a host cron job.
# Note: stdio:/dev/stdout kills squid here - it drops privileges to uid 13 and
# cannot open the container's stdout.
# The compose healthcheck opens a TCP probe from 127.0.0.1 every 10s and shows
# up as error:transaction-end-before-headers. Left in, it fills the 16 MB tmpfs
# in about three weeks with nothing but noise. Excluded from the journal.
acl localprobe src 127.0.0.1/32 ::1
logformat compact %tl %>a %Ss %rm %ru %Hs %<st
access_log /var/log/squid/access.log compact !localprobe
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /tmp
visible_hostname hermes-egress-proxy
shutdown_lifetime 1 seconds
